name: Prepare a draft Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version matching Directory.Build.props, for example 0.2.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore HashLynx.sln
      - name: Build Release
        run: dotnet build HashLynx.sln -c Release --no-restore
      - name: Offline unit tests
        run: dotnet test HashLynx.sln -c Release --no-build --filter 'Category!=Integration&Category!=LiveDevice' --logger trx
      - name: WPF smoke checks
        run: dotnet run --project tests/HashLynx.UI.Smoke -c Release --no-build -- artifacts/ui-smoke
      - name: Package application and checksums
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/package-release.ps1 -Version $env:RELEASE_VERSION -OutputDirectory artifacts/release
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$env:RELEASE_VERSION" artifacts/release/HashLynx-win-x64.zip artifacts/release/SHA256SUMS.txt --draft --title "HashLynx $env:RELEASE_VERSION" --notes-file artifacts/release/release-notes.md --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Creating the draft release failed.' }

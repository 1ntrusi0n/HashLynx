name: Windows build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore HashLynx.sln
      - name: Build Release
        run: dotnet build HashLynx.sln -c Release --no-restore
      - name: Unit tests (no Hashcat or GPU required)
        run: dotnet test HashLynx.sln -c Release --no-build --filter 'Category!=Integration' --logger trx
      - name: WPF startup and page smoke checks
        run: dotnet run --project tests/HashLynx.UI.Smoke -c Release --no-build -- artifacts/ui-smoke
